<!doctype html><html dir="rtl" lang="fa"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب شخصی</title><style>body{background:#18344c;color:white;font:16px Tahoma;max-width:700px;margin:30px auto;padding:20px;line-height:2}a{color:#cdeaff}button,select{font:inherit;padding:12px;margin:7px;border-radius:10px}li{margin:12px 0}</style><h1>حساب و نسخه‌های ذخیره‌شده</h1><a href="/">برنامه جامع</a><p id="email"></p><p>نسخه‌های ذخیره‌شده روی همین سرورند؛ جای پشتیبان مستقل خارج سرور را نمی‌گیرند.</p><select id="mod"><option value="planning">برنامه‌ریزی</option><option value="expenses">هزینه</option></select><button id="refresh">نمایش نسخه‌ها</button><button id="export">دانلود آخرین پشتیبان سرور</button><ul id="list"></ul><p id="msg"></p><button id="logout">خروج</button><script type="module">let me=await(await fetch('/api/me')).json();document.getElementById('email').textContent=me.email;const $=id=>document.getElementById(id);function download(body){let u=URL.createObjectURL(new Blob([body],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=$('mod').value+'-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('refresh').onclick=async()=>{let module=$('mod').value,r=await fetch('/api/history/'+module),items=await r.json();$('list').replaceChildren();for(let x of items){let li=document.createElement('li');li.textContent='نسخه '+x.revision+' · '+new Date(x.created).toLocaleString('fa-IR',{timeZone:'Asia/Tehran'});let b=document.createElement('button');b.textContent='دانلود این نسخه';b.onclick=async()=>{let r=await fetch('/api/history/'+module+'/'+x.revision);download((await r.json()).body)};li.append(b);$('list').append(li)}};$('export').onclick=async()=>{let r=await fetch('/api/state/'+$('mod').value),d=await r.json();if(d.data)download(JSON.stringify(d.data,null,2));else $('msg').textContent='هنوز داده‌ای ثبت نشده است'};$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',headers:{'X-CSRF-Token':me.csrf}});location.href='/login'};</script></html>
